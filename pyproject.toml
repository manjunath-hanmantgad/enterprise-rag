[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Local-first enterprise RAG system with citations, access control, and retrieval evaluation."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.0",
  "pydantic==2.7.4",
  "python-dotenv==1.0.1",
  "streamlit==1.36.0",
  "httpx==0.27.0",
  "PyJWT==2.10.1",
  "cryptography==46.0.3",
  "psycopg[binary]==3.2.1"
]

[project.optional-dependencies]
dev = ["pytest==8.2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
